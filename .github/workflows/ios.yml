name: iPhone receiver

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone app for simulator
        run: |
          xcodebuild -project ios/SyncAudioReceiver.xcodeproj \
            -scheme SyncAudioReceiver \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build iPhone Release configuration for simulator
        run: |
          xcodebuild -project ios/SyncAudioReceiver.xcodeproj \
            -scheme SyncAudioReceiver -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run packet parser tests
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((d["udid"] for group in data["devices"].values() for d in group if d["name"].startswith("iPhone")), ""))')
          test -n "$device_id"
          xcodebuild -project ios/SyncAudioReceiver.xcodeproj \
            -scheme SyncAudioReceiver \
            -destination "platform=iOS Simulator,id=$device_id" \
            CODE_SIGNING_ALLOWED=NO test
